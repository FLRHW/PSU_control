name: CPX400DP offline regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpx400dp-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: scripts
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline GUI/plot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib
      - name: Compile Python source and tests
        run: |
          python -m compileall -q scripts tests
      - name: Run entire offline test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/cpx400dp-tests.log
          {
            echo '## CPX400DP offline regression'
            echo ''
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ''
            echo '```'
            tail -n 12 /tmp/cpx400dp-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
