name: CPX400DP offline regression

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpx400dp-offline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unittest:
    name: Python offline suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: scripts
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline GUI/plot dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 matplotlib
      - name: Compile Python source and tests
        run: |
          python -m compileall -q scripts tests
      - name: Run entire offline test suite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_*.py' -v 2>&1 | tee /tmp/cpx400dp-tests.log
          {
            echo '## CPX400DP offline regression'
            echo ''
            echo "Commit: \`${GITHUB_SHA}\`"
            echo ''
            echo '```'
            tail -n 12 /tmp/cpx400dp-tests.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser_report:
    name: Offline Chromium large-report visual smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: scripts
      CPX_BROWSER_SCREENSHOT_DIR: ${{ runner.temp }}/cpx-browser-artifacts
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline headless Chromium testing dependency
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate generated 1000h report inside real browser
        run: python tests/browser_report_smoke.py
      - name: Save synthetic screenshot for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpx400dp-synthetic-report-browser
          path: ${{ runner.temp }}/cpx-browser-artifacts/
          if-no-files-found: ignore
          retention-days: 5
